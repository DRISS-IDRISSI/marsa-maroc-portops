<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marsa Maroc PortOps — TCE & TC3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marine: { 50:'#E8F0F8',100:'#D1E1F1',200:'#A3C3E3',300:'#6BA3D6',400:'#3A85C8',500:'#1A5276',600:'#15405E',700:'#0F2F45',800:'#0B2030',900:'#081820' },
                        terra: { 50:'#FDF2E9',100:'#FADBC4',200:'#F5B88A',300:'#F09450',400:'#E67E22',500:'#D35400',600:'#A04000',700:'#7A3000',800:'#542000',900:'#3A1600' },
                        port: '#0B1426', card: '#111D35', surface: '#1A2A47', border: '#243555'
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                }
            }
        }
    </script>
    <style>body{background:#0B1426;color:#E2E8F0;font-family:Inter,system-ui,sans-serif;scrollbar-width:thin;scrollbar-color:#243555 #0B1426;}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0B1426}::-webkit-scrollbar-thumb{background:#243555;border-radius:3px}
    .fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .pulse-dot{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <script src="src/data.js"></script>
    <script src="src/components.js" type="text/babel"></script>
    <script src="src/pages.js" type="text/babel"></script>
    <script src="src/app.js" type="text/babel"></script>
</body>
</html>
