name: Deploy RTG Driver Planner to GitHub Pages

on:
  push:
    branches: ["claude/new-session-0yhk5k"]
    paths: ["rtg-driver-planner/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/new-session-0yhk5k
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload RTG Driver Planner as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rtg-driver-planner
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
