<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CES Driver Planner — Marsa Maroc</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1426">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RTG Planner">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- react-router-dom@6's UMD bundle needs @remix-run/router and react-router loaded
         as globals first, or the router throws on mount. -->
    <script src="https://unpkg.com/@remix-run/router@1/dist/router.umd.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-router@6/dist/umd/react-router.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marine: { 50:'#E8F0F8',100:'#D1E1F1',200:'#A3C3E3',300:'#6BA3D6',400:'#3A85C8',500:'#1A5276',600:'#15405E',700:'#0F2F45',800:'#0B2030',900:'#081820' },
                        terra: { 50:'#FDF2E9',100:'#FADBC4',200:'#F5B88A',300:'#F09450',400:'#E67E22',500:'#D35400',600:'#A04000',700:'#7A3000',800:'#542000',900:'#3A1600' },
                        port: '#0B1426', card: '#111D35', surface: '#1A2A47', border: '#243555'
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                }
            }
        }
    </script>
    <style>body{background:#0B1426;color:#E2E8F0;font-family:Inter,system-ui,sans-serif;scrollbar-width:thin;scrollbar-color:#243555 #0B1426;}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0B1426}::-webkit-scrollbar-thumb{background:#243555;border-radius:3px}
    .fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .pulse-dot{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @media print {
      @page { size: landscape; margin: 10mm; }
      body { background: #fff !important; }
    }
    /* Blocs dédiés aux rapports imprimables (Planning mensuel, Affectation du
       jour) : masqués à l'écran, affichés uniquement à l'impression / export
       PDF. Règles explicites (plutôt que les utilitaires Tailwind hidden/print:block)
       car l'ordre d'injection du CDN Tailwind ne garantit pas leur priorité. */
    .print-report { display: none; }
    @media print {
      .print-report { display: block !important; }
    }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <!-- Le ?v=... sur chaque script propre à l'appli force le navigateur à
         retélécharger le fichier après un déploiement, même si son cache
         HTTP le considère encore "frais" pour telle ou telle URL — sans ça,
         un onglet peut se retrouver avec un mélange de fichiers d'anciennes
         et de nouvelles versions (déjà observé : pages.js à jour mais
         store.js encore ancien, RTGStore.xxx "n'est pas une fonction").
         À CHAQUE modification d'un fichier src/**, incrémenter TOUS les
         "?v=" ci-dessous (même valeur partout, ex. date + compteur) en même
         temps que version.json. -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="src/data.js?v=20260924-51"></script>
    <script src="src/supabaseClient.js?v=20260924-51"></script>
    <script src="src/store.js?v=20260924-51"></script>
    <script src="src/engines/dateUtils.js?v=20260924-51"></script>
    <script src="src/engines/shiftRotationEngine.js?v=20260924-51"></script>
    <script src="src/engines/absenceEngine.js?v=20260924-51"></script>
    <script src="src/engines/exceptionEngine.js?v=20260924-51"></script>
    <script src="src/engines/restDayEngine.js?v=20260924-51"></script>
    <script src="src/engines/vacationRotationEngine.js?v=20260924-51"></script>
    <script src="src/engines/ccPosteRotationEngine.js?v=20260924-51"></script>
    <script src="src/engines/zoneRotationEngine.js?v=20260924-51"></script>
    <script src="src/engines/zoneBalancingEngine.js?v=20260924-51"></script>
    <script src="src/engines/planningEngine.js?v=20260924-51"></script>
    <script src="src/engines/validationEngine.js?v=20260924-51"></script>
    <script src="src/engines/replacementEngine.js?v=20260924-51"></script>
    <script src="src/engines/holidayEngine.js?v=20260924-51"></script>
    <script src="src/engines/congeBalanceEngine.js?v=20260924-51"></script>
    <script src="src/engines/assistantEngine.js?v=20260924-51"></script>
    <script src="src/components.js?v=20260924-51" type="text/babel"></script>
    <script src="src/pages.js?v=20260924-51" type="text/babel"></script>
    <script src="src/pages2.js?v=20260924-51" type="text/babel"></script>
    <script src="src/app.js?v=20260924-51" type="text/babel"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
</body>
</html>
